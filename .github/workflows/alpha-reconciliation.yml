name: Alpha Linux Native reconciliation replay

on:
  push:
    branches: ["codex/application-alpha-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: sbt/setup-sbt@v1
      - name: Three frozen full Native-suite attempts with exact seed regression
        run: python3 ci/replay-reconciliation.py
      - name: Preserve every attempt and protocol even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-linux-native-reconciliation-${{ github.sha }}
          path: target/alpha-linux-replay
          if-no-files-found: error
          retention-days: 30
