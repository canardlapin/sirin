name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - name: JVM tests
        shell: bash
        run: sbt -batch testJVM
      - name: Scala Native tests
        shell: bash
        run: sbt -batch testNative
      - name: Authoring corpus type-checks (A-0)
        shell: bash
        run: sbt -batch examples/compile

  abi:
    name: native ABI probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - name: Fetch pinned native artifacts
        shell: bash
        run: native/fetch.sh
      - name: Put Windows DLLs on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/native/vendor/wgpu-windows-x86_64/lib" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/native/vendor/SDL3-3.4.18/lib/x64" >> "$GITHUB_PATH"
      - name: ABI tests (struct layouts, by-value round trip, SDL constants)
        shell: bash
        run: sbt -batch probeWindow/test
