name: CI

on:
  push:
    branches: [main, "codex/application-alpha-*"]
  pull_request:

jobs:
  core:
    name: core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - name: JVM tests
        shell: bash
        run: sbt -batch testJVM
      - name: Scala Native tests
        shell: bash
        run: sbt -batch testNative
      - name: Authoring corpus type-checks (A-0)
        shell: bash
        run: sbt -batch examples/compile

  fonts:
    name: native font and paragraph services (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: sbt/setup-sbt@v1
      - name: Font build tools
        run: python -m pip install meson==1.7.0 ninja==1.11.1.3
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Fetch and build pinned minimal font stack
        run: native/fetch-macos.sh --text
      - name: Verify pinned fonts and native shaping/raster tests
        run: sbt -batch textNative/test
      - name: Fetch and build pinned Unicode component for paragraph integration
        run: native/fetch-macos.sh --unicode
      - name: Verify shaping, wrapping, core text services and prepared Canvas recording
        run: sbt -batch probeParagraph/test

  unicode:
    name: isolated Unicode probe (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: sbt/setup-sbt@v1
      - name: Fetch and build pinned Unicode stack
        run: native/fetch-macos.sh --unicode
      - name: Verify reference fixtures and native Unicode analysis
        run: sbt -batch probeUnicode/test

  abi:
    name: native ABI probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - name: Fetch pinned native artifacts
        shell: bash
        run: native/fetch.sh
      - name: Put Windows DLLs on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/native/vendor/wgpu-windows-x86_64/lib" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/native/vendor/SDL3-3.4.18/lib/x64" >> "$GITHUB_PATH"
      - name: ABI tests (struct layouts, by-value round trip, SDL constants)
        shell: bash
        run: sbt -batch probeWindow/test

  desktop-host:
    name: JVM application host and package (macOS)
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: sbt/setup-sbt@v1
      - name: Native build tools
        run: python -m pip install meson==1.7.0 ninja==1.11.1.3
      - name: Prepare pinned native host dependencies
        run: |
          native/fetch-macos.sh
          native/fetch-macos.sh --text
          native/fetch-macos.sh --unicode
          native/fetch-macos.sh --thorvg
          native/fetch-macos.sh --sirin
      - name: Headless host, editor policy and launch ownership checks
        run: sbt -batch 'desktopJVM/testOnly sirin.desktop.ApplicationMenusSuite sirin.desktop.NativeApplicationSuite sirin.desktop.RenderServiceSuite sirin.desktop.EditorControllerSuite sirin.desktop.NativeAbiSuite'
      - name: Package the public application entry without launching UI
        run: sbt -batch desktopJVM/desktopApplicationPackage
      - name: Verify bundled native closure and strict signature
        run: python3 -B desktop/tools/portable-image.py desktop/target/package-application/SirinAlpha.app --load-library
