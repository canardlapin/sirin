[Application]
app.classpath=$APPDIR/sirin.jar
app.mainclass=sirin.desktop.DesktopWorkbench
app.classpath=$APPDIR/scala-library-2.13.16.jar
app.classpath=$APPDIR/scala3-library_3-3.7.4.jar

[JavaOptions]
java-options=-Djpackage.app-version=1.0
java-options=-XstartOnFirstThread
java-options=--enable-native-access=ALL-UNNAMED
java-options=-Dsirin.desktop.library=$APPDIR/libsirin_desktop.dylib
java-options=-Dsirin.repo=/private/tmp/sirin-editor-20261029

[ArgOptions]
arguments=editor
