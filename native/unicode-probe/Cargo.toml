[package]
name = "sirin-unicode-probe"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
icu_capi = { path = "../vendor/unicode/icu4x-031d9e89f6a3fd26a14491e090729d46094328fd/ffi/capi", default-features = false, features = ["std", "compiled_data", "properties", "segmenter"] }
icu_segmenter = { path = "../vendor/unicode/icu4x-031d9e89f6a3fd26a14491e090729d46094328fd/components/segmenter", default-features = false, features = ["compiled_data", "unstable"] }
unicode-bidi = { version = "=0.3.18", default-features = false }
icu_properties = { path = "../vendor/unicode/icu4x-031d9e89f6a3fd26a14491e090729d46094328fd/components/properties", default-features = false, features = ["compiled_data"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
